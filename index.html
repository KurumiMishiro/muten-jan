<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>無聴雀</title>
<meta name="description" content="無聴雀 - 三人麻雀 CPU対戦（12枚＋無牌）">
<style>*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05070d;color:#e8ecf4;font-family:"Yu Gothic UI","Meiryo","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP",sans-serif;user-select:none;-webkit-user-select:none}
#stage{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px)}
#stage canvas{display:block}
#hud{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);pointer-events:none}
#hud button,#hud .plate{pointer-events:auto}
button{font-family:inherit;cursor:pointer}
#info{position:absolute;left:14px;top:12px;background:rgba(8,12,22,.72);border:1px solid #2d3a55;border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5;min-width:150px}
#info .dora{display:flex;align-items:center;gap:8px}
#info .ti{height:40px}
.stk{display:inline-block;width:34px;height:7px;border-radius:3px;vertical-align:middle;background:#f6f2e6;position:relative}
.stk.r::after{content:"";position:absolute;left:14px;top:0;width:6px;height:7px;border-radius:50%;background:#c4202b}
.stk.h{background:repeating-linear-gradient(90deg,#f6f2e6 0 4px,#222 4px 6px)}
.rname{color:#9fb0c8}
#topr{position:absolute;right:12px;top:10px;display:flex;gap:8px}
#topr button{width:42px;height:42px;border-radius:50%;border:2px solid #4a5a7a;background:rgba(10,14,26,.85);color:#dfe6f5;font-size:20px}
#topr button:hover{border-color:#9cc0ff}
#bar{position:absolute;left:12px;top:50%;transform:translateY(-62%);display:flex;flex-direction:column;gap:7px}
#bar button{width:60px;height:56px;border-radius:14px;border:2px solid #556284;background:linear-gradient(#26324c,#141b2c);color:#f2f5fb;font-size:27px;font-weight:bold;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 3px 8px rgba(0,0,0,.5)}
#bar button small{font-size:10px;font-weight:normal;margin-top:3px;color:#b8c4dc}
#bar button:disabled{opacity:.32;cursor:default}
#bar button.glow{border-color:#ffcf5a;background:linear-gradient(#7a5410,#3d2a06);animation:pulse 0.9s infinite alternate}
#bar button.on{border-color:#ff6b6b;background:linear-gradient(#7a1c1c,#3d0d0d)}
@keyframes pulse{from{box-shadow:inset 0 0 0 2px rgba(255,207,90,.55),0 3px 8px rgba(0,0,0,.5)}to{box-shadow:inset 0 0 0 2px #ffcf5a,0 0 9px 1px rgba(255,207,90,.8)}}
#bar button,#bar button.glow,#bar button.on,#bar button:active{transform:none;transition:none;flex:none}
.plate{position:absolute;background:rgba(8,12,22,.8);border:1px solid #33415f;border-radius:10px;padding:6px 10px;min-width:170px;font-size:13px}
.plate.turn{border-color:#ffcf5a;box-shadow:0 0 12px rgba(255,207,90,.5)}
#plate1{left:calc(50% + 40px);top:10px}
#plate2{right:calc(50% + 40px);top:10px}
#plate0{left:50%;transform:translateX(-50%);bottom:calc(var(--strip,20%) + 6px);display:flex;gap:12px;align-items:center;min-width:0;padding:4px 12px}
#plate0 .pts{font-size:17px}
.pl-top{display:flex;gap:6px;align-items:center}
.wind{display:inline-block;width:22px;height:22px;text-align:center;line-height:22px;border-radius:4px;background:#3a4150;font-weight:bold}
.wind.dealer{background:#e0592a}
.rch{background:#c4202b;color:#fff;border-radius:4px;padding:0 5px;font-size:11px}
.plate .pts{font-size:20px;font-weight:bold;color:#ffe9a8}
.la{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:4px}
.chip{border-radius:6px;padding:3px 8px;font-weight:bold;font-size:15px}
.chip.te{background:#d92626;color:#fff}.chip.tg{background:#56606c;color:#fff}.chip.ins{background:#169a48;color:#fff}.chip.pon{background:#7d55ff;color:#fff}.chip.dim{background:#2a3244;color:#8994aa;font-weight:normal;font-size:12px}
.ti{height:44px;vertical-align:middle;border-radius:3px}.ti.sm{height:32px}.ti.xs{height:22px}
#msg{position:absolute;left:50%;bottom:calc(var(--strip,20%) + 52px);transform:translateX(-50%)}
#msg .m{background:rgba(8,12,22,.85);border:1px solid #4a5a7a;border-radius:20px;padding:6px 18px;font-size:15px;white-space:nowrap}
#hint{position:absolute;right:14px;bottom:calc(var(--strip,20%) + 10px);font-size:13px;background:rgba(8,12,22,.6);border-radius:8px;padding:2px 8px}
#hint:empty{display:none}.furi{color:#ff7a7a}
#fx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.toast{position:absolute;top:38%;font-size:64px;font-weight:900;letter-spacing:.1em;color:#fff;text-shadow:0 0 18px #000,0 4px 0 #000;animation:pop 1.5s forwards}
.toast.riichi{color:#ff6b6b}.toast.win{color:#ffcf5a;font-size:90px}.toast.pon{color:#b49bff}.toast.round{font-size:44px;color:#dfe6f5}
@keyframes pop{0%{transform:scale(.5);opacity:0}12%{transform:scale(1.08);opacity:1}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.modal{position:fixed;inset:0;background:rgba(2,4,10,.55);display:flex;align-items:center;justify-content:center;z-index:10}
.modal .box{background:linear-gradient(#18213a,#0f1526);border:1px solid #3d4d72;border-radius:14px;padding:18px 24px;max-width:min(860px,94vw);max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.ttl{font-size:24px;font-weight:bold;margin-bottom:8px}.sub{font-size:13px;color:#9fb0c8;font-weight:normal}
.btns{display:flex;gap:10px;justify-content:center;margin-top:14px}.btns.col{flex-direction:column;align-items:center}
.btns button{min-width:120px;padding:9px 18px;border-radius:10px;border:1px solid #556284;background:#1f2a42;color:#eef;font-size:15px}
.btns button.primary{background:linear-gradient(#3b6fd8,#2550a8);border-color:#7ea6ff}
.btns button.big{font-size:20px;padding:12px 30px}
table{border-collapse:collapse}td{padding:3px 10px}
.yaku td:last-child{text-align:right;color:#ffcf5a}
.dt td:nth-child(2),.dt td:nth-child(3){text-align:right}
.plus{color:#7dff9a}.minus{color:#ff8080}
.win-line{margin:6px 0}.pts{margin:6px 0}
.reveal{margin:10px 0;font-size:12px}.reveal .row{display:flex;align-items:center;gap:8px;margin:3px 0}.reveal .lbl{width:80px}.reveal .ord{color:#9fb0c8}.meld{margin-left:8px}
.rank td{font-size:18px}.rk{color:#ffcf5a}
.hist td{font-size:12px}
.title .box{text-align:center;padding:30px 50px;background:linear-gradient(#131c33ee,#0b101ee6)}
.title-logo{font-size:72px;font-weight:900;letter-spacing:.15em;font-family:"Yu Mincho","Noto Serif CJK JP",serif;color:#f3eee0;text-shadow:0 0 24px #3b6fd8}
.title-sub{color:#9fb0c8;margin-bottom:10px}
.help{max-width:720px;font-size:14px;line-height:1.7}.help h3{font-size:16px;margin:12px 0 4px;color:#9cc0ff}.help .r{color:#ff6b6b}.help .g{color:#5fe08a}
.set{display:grid;grid-template-columns:130px 1fr;gap:10px 14px;align-items:center;font-size:14px}.set .k{color:#9fb0c8}.opt{margin-right:12px;white-space:nowrap}
input[type=range]{vertical-align:middle;width:180px}
details{margin-top:10px;font-size:13px}

.ti.back{display:inline-block;width:24px;height:32px;background:linear-gradient(#3a7be0,#2559b0);border-radius:3px;vertical-align:middle;margin:0 1px}
#bootfail{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#101a33;color:#fff;font-size:20px;text-align:center;z-index:99999;gap:6px}
.storeNote{margin-top:10px;font-size:12px;opacity:.75;line-height:1.5;word-break:break-all}.storeNote b{color:#ffd76a;font-weight:600}
#errbox{position:fixed;left:12px;bottom:12px;max-width:520px;background:rgba(60,10,16,.94);color:#ffe8e8;border:1px solid #ff7b7b;border-radius:8px;padding:8px 30px 8px 12px;font-size:12px;z-index:100000;line-height:1.5;word-break:break-all}
#errbox .x{position:absolute;right:8px;top:4px;cursor:pointer;font-size:14px}#errbox .h{opacity:.8;margin-top:4px}#errbox .l div{border-top:1px solid rgba(255,255,255,.12);padding-top:2px}

/* ===== スマホ・タッチ ===== */
html,body{overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{position:fixed;inset:0;width:100%}
button,input,label{touch-action:manipulation}
.modal .box{touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
img{-webkit-user-drag:none;-webkit-touch-callout:none}
#rotHint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);z-index:50;background:rgba(20,30,55,.94);border:1px solid #7ea6ff;border-radius:22px;padding:8px 14px;font-size:14px;white-space:nowrap;display:none;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
#rotHint.show{display:flex}#rotHint .ic{font-size:20px;color:#9cc0ff}#rotHint .x{opacity:.7;margin-left:4px}
html.touch #bar button{width:58px;height:54px}
html.touch #topr button{width:46px;height:46px}
html.touch .btns button{min-height:44px}
html.touch .opt{display:inline-flex;align-items:center;min-height:34px}
html.touch .opt input{width:20px;height:20px}
html.touch input[name=name]{font-size:16px}
html.touch #errbox{bottom:calc(var(--strip,20%) + 8px)}
/* 横向き・高さが低い画面（スマホ横） */
@media (max-height:560px) and (orientation:landscape){
  #info{left:8px;top:6px;padding:4px 8px;font-size:11px;line-height:1.35;min-width:0}
  #info .ti{height:26px}
  .stk{width:24px;height:5px}
  #topr{right:8px;top:6px;gap:6px}
  #topr button{width:40px;height:40px;font-size:18px}
  html.touch #topr button{width:42px;height:42px}
  #bar{left:8px;top:auto;bottom:calc(var(--strip,20%) + 6px);transform:none;display:grid;grid-template-columns:repeat(2,auto);gap:6px}
  #bar button,html.touch #bar button{width:54px;height:50px;font-size:23px;border-radius:12px}
  #bar button small{font-size:9px;margin-top:2px}
  .plate{padding:3px 8px;min-width:0;font-size:11px}
  .plate .pts{font-size:15px}
  .chip{font-size:11px;padding:2px 6px}
  .ti.sm{height:24px}
  #plate1{left:calc(50% + 16px);top:6px}#plate2{right:calc(50% + 16px);top:6px}
  #plate0{padding:2px 10px;gap:8px;bottom:calc(var(--strip,20%) + 4px)}#plate0 .pts{font-size:14px}
  .wind{width:18px;height:18px;line-height:18px;font-size:12px}
  #msg{bottom:calc(var(--strip,20%) + 34px);left:calc(50% + 30px)}
  #msg .m{font-size:12px;padding:4px 12px;white-space:normal;max-width:min(560px,62vw);text-align:center}
  #hint{right:8px;font-size:11px;bottom:calc(var(--strip,20%) + 6px);max-width:30vw}
  .ti.xs{height:18px}
  .toast{font-size:44px}.toast.win{font-size:62px}.toast.round{font-size:30px}
  .modal .box{padding:12px 16px;max-height:94vh}
  .title .box{padding:16px 30px}.title-logo{font-size:48px}
  .btns{margin-top:8px}.btns button.big{font-size:18px;padding:9px 26px}
  .ttl{font-size:19px}
  .set{gap:4px 12px;font-size:13px;grid-template-columns:110px 1fr}
}
/* 縦向き */
@media (orientation:portrait) and (max-width:700px){
  #info{left:8px;top:6px;padding:4px 8px;font-size:11px;line-height:1.35;min-width:0}
  #info .ti{height:26px}
  .stk{width:24px;height:5px}
  #topr{right:8px;top:6px}
  .plate{padding:3px 8px;min-width:0;font-size:11px;max-width:calc(50% - 14px)}
  .plate .pts{font-size:15px}.chip{font-size:11px;padding:2px 6px}.ti.sm{height:24px}
  #plate2{left:8px;right:auto;top:86px}#plate1{right:8px;left:auto;top:86px}
  #plate0{bottom:calc(var(--strip,20%) + 4px);padding:2px 10px}#plate0 .pts{font-size:14px}
  #bar{left:6px;top:auto;bottom:calc(var(--strip,20%) + 40px);transform:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;right:6px}
  #bar button,html.touch #bar button{width:auto;min-width:0;height:52px;font-size:22px;border-radius:12px;padding:0}
  #msg{left:50%}
  #bar button small{font-size:9px}
  #msg{bottom:calc(var(--strip,20%) + 100px);width:94vw}
  #msg .m{font-size:12px;white-space:normal;text-align:center;padding:5px 12px}
  #hint{right:8px;left:8px;bottom:calc(var(--strip,20%) + 148px);font-size:11px;text-align:center}
  .ti.xs{height:16px}
  .toast{font-size:40px}.toast.win{font-size:58px}.toast.round{font-size:28px}
  .modal .box{padding:14px 14px;max-width:96vw;max-height:88vh}
  .title-logo{font-size:52px}.title .box{padding:22px 20px}
  .set{grid-template-columns:1fr;gap:2px}.set .k{margin-top:8px}
  #rotHint{top:calc(env(safe-area-inset-top,0px) + 150px)}
}
.modal .box>.btns:last-child{position:sticky;bottom:-12px;padding:8px 0 4px;background:linear-gradient(rgba(15,21,38,0),#0f1526 40%)}
@media (max-height:560px) and (orientation:landscape){ html.touch .opt{min-height:30px} .storeNote{margin-top:4px} }

/* 小さい画面：ボタンは大きさを変えず、必ず画面内に収める */
.btns{flex-wrap:wrap}
.reveal .row{flex-wrap:wrap}.reveal .tiles{display:inline-flex;flex-wrap:wrap;align-items:center}
@media (orientation:portrait) and (max-width:359px){
  #bar{grid-template-columns:repeat(4,minmax(0,1fr))}
  #msg{bottom:calc(var(--strip,20%) + 158px)}
  #hint{bottom:calc(var(--strip,20%) + 206px)}
  .plate{font-size:10px}.plate .pts{font-size:13px}.chip{font-size:10px;padding:2px 4px}
  #plate2,#plate1{top:80px}
  .title-logo{font-size:42px}.title-sub{font-size:12px}
  .ttl{font-size:18px}
  .reveal .lbl{width:auto;min-width:60px}.ti.sm{height:22px}
  .btns button{min-width:96px;padding:9px 12px}
}
@media (orientation:portrait) and (max-height:600px){
  #plate2,#plate1{top:74px}
  .plate .la .ti.sm{height:20px}
}
@media (orientation:landscape) and (max-height:430px){
  #bar{grid-template-columns:repeat(3,auto);gap:5px}
  #bar button,html.touch #bar button{width:50px;height:46px;font-size:21px}
  #info .ti{height:22px}
  .reveal{font-size:11px}.ti.sm{height:22px}
}
@media (orientation:landscape) and (max-height:340px){
  #info{font-size:10px}
  #bar button,html.touch #bar button{width:48px;height:44px;font-size:20px}
  #bar button small{font-size:8px;margin-top:1px}
  #topr button,html.touch #topr button{width:40px;height:40px}
}
@media (max-width:400px){ input[type=range]{width:130px} .set input[name=name]{max-width:100%;width:180px} .storeNote{word-break:break-all} }
@media (max-width:400px){ .opt{white-space:normal} .set{grid-template-columns:minmax(0,1fr)} }
@media (orientation:landscape) and (max-height:560px){ #plate1,#plate2{max-width:calc(50% - 124px)} #plate1 .la,#plate2 .la{gap:3px} }
</style></head>

<script>
/* 起動の見張り：一定時間内に起動しない／起動中にエラーなら一度だけ自動で読み込み直す */
(function(){var K='mutenjan_boot',n=0;try{n=+(sessionStorage.getItem(K)||0);}catch(e){}
 var done=false;function fail(why){if(done||window.__mtReady)return;done=true;
  if(n<2){try{sessionStorage.setItem(K,String(n+1));}catch(e){} setTimeout(function(){location.reload();},300);}
  else{try{if(window.mutenjanNative)window.mutenjanNative.log('BOOT FAIL '+why);}catch(_){}var d=document.createElement('div');d.id='bootfail';d.innerHTML='起動に失敗しました。<br>いったん閉じて、もう一度起動してください。<br><small>'+String(why||'').replace(/[<>&]/g,'')+'</small>';document.body.appendChild(d);}}
 window.__mtBootFail=fail;window.__mtBootOK=function(){window.__mtReady=true;try{sessionStorage.removeItem(K);}catch(e){}};
 var nerr=0;function report(msg){msg=String(msg||'不明なエラー');try{if(window.mutenjanNative)window.mutenjanNative.log('ERROR '+msg);}catch(_){}
  if(++nerr>6)return;var b=document.getElementById('errbox');
  if(!b){b=document.createElement('div');b.id='errbox';b.innerHTML='<b>エラーが起きました</b><span class="x">✕</span><div class="l"></div><div class="h">'+(window.mutenjanNative?'MutenJan_data\\log.txt にも記録しています。':'')+'この内容を教えてもらえると直せます。</div>';b.querySelector('.x').onclick=function(){b.remove();nerr=0;};(document.body||document.documentElement).appendChild(b);}
  var l=document.createElement('div');l.textContent=msg.slice(0,300);b.querySelector('.l').appendChild(l);}
 window.__mtReport=report;
 window.addEventListener('error',function(e){var m=(e&&e.message)||'';if(e&&e.filename)m+=' ('+String(e.filename).split('/').pop()+':'+e.lineno+')';report(m);if(!window.__mtReady)setTimeout(function(){fail(e&&e.message);},1500);});
 window.addEventListener('unhandledrejection',function(e){var r=e&&e.reason;report('Promise: '+((r&&(r.stack||r.message))||r));});
 setTimeout(function(){fail('timeout');},20000);})();
</script>

<h3>見どころ：相手が「どこから切ったか」</h3>

${ti?"タップで選ぶ→もう一度タップで打牌（別の牌をタップすると選び直し）。<b>長押し、または左右にドラッグ</b>で並べ替え。":"ドラッグで並べ替え。クリックで選ぶ→ほかの牌をクリックでそこへ移動（Shift+クリックで入れ替え）。選んだ牌をもう一度クリックで打牌。"}ツモ牌は右端に離して置かれます。自動では並びません。［理］を押したときだけ並べます。

<h3>ルール</h3>
・三人麻雀（萬子は1と9だけ）、東南戦、テンパイ連荘、30000点持ち30000点返し。<br>
・手牌は12枚。<b>13枚目は見えない「無牌（むはい）」</b>として、好きな牌になれます（自分の手で5枚目になる牌にはなれません。カンした牌も数えます）。<br>
・赤5p・赤5sなし、裏ドラなし、抜きドラなし。北は全員の役牌。ツモ損なし。ツモったら必ず1枚切ります。<br>
